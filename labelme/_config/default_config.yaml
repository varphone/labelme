---
auto_save: true
display_label_popup: true
with_image_data: false
keep_prev: false
keep_prev_scale: false
keep_prev_brightness_contrast: false
# Snap the drawing cursor to the nearest annotation point.
snap_to_point: false
# UI language as a locale code (e.g. ja_JP); null follows the system locale.
language:
# Color theme: 'system' follows the OS appearance, or force 'light' / 'dark'.
color_theme: system
flags:
label_flags:
labels:
file_search:
sort_labels: true
validate_label:
shape_color:
  mode: auto  # auto, uniform, by_label
  auto:
    shift: 0
  uniform:
    color: [0, 255, 0]
  by_label:
    colors:
    fallback: [0, 255, 0]
shape:
  # drawing
  line_color: [0, 255, 0, 128]
  fill_color: [0, 0, 0, 64]
  vertex_fill_color: [0, 255, 0, 255]
  # selecting / hovering
  select_line_color: [255, 255, 255, 255]
  select_fill_color: [0, 255, 0, 64]
  hvertex_fill_color: [255, 255, 255, 255]
  point_size: 8
  show_labels: false
minimap:
  show_shape_outlines: true
mask_polygonization:
  detail: 80
ai:
  default: Sam2 (balanced)
  suppress_existing_shape_matches: false
# Global defaults for opt-in linestrip profile measurement. Shape/profile data
# remains independent from these settings.
line_profile_measurement:
  sample_spacing: 8.0
  search_radius: 32.0
  min_width: 1.0
  max_width: 256.0
  contrast_factor: 0.35
  width_filter_strength: 20
  fixed_width: 0.0
# main
flag_dock:
  show: true
  closable: true
  movable: true
  floatable: true
label_dock:
  show: true
  closable: true
  movable: true
  floatable: true
shape_dock:
  show: true
  closable: true
  movable: true
  floatable: true
file_dock:
  show: true
  closable: true
  movable: true
  floatable: true
# label_dialog
show_label_text_field: true
label_completion: startswith
fit_to_content:
  column: true
  row: false
# canvas
epsilon: 10.0
canvas:
  fill_drawing: true
  # None: do nothing
  # close: close polygon
  double_click: close
  # max undo depth (number of edits kept on the backup stack)
  num_backups: 10
  # allow annotation points to extend beyond the image boundary
  allow_out_of_bounds_points: false
  # show crosshair
  crosshair:
    polygon: false
    rectangle: true
    oriented_rectangle: false
    circle: false
    line: false
    point: false
    linestrip: false
    bezier2: false
    bezier3: false
    catmull_rom: false
    bspline: false
    ai_points_to_shape: false
    ai_box_to_shape: true
shortcuts:
  close: Ctrl+W
  open: Ctrl+O
  open_dir: Ctrl+U
  quit: Ctrl+Q
  save: Ctrl+S
  save_as: Ctrl+Shift+S
  save_to:
  delete_file: Ctrl+Delete
  delete_image_file: Shift+Delete
  open_next: [D, Ctrl+Shift+D]
  open_prev: [A, Ctrl+Shift+A]
  zoom_in: [Ctrl++, Ctrl+=]
  zoom_out: Ctrl+-
  zoom_to_original: Ctrl+0
  fit_window: Ctrl+F
  fit_width: Ctrl+Shift+F
  create_polygon: Ctrl+N
  create_rectangle: Ctrl+R
  create_oriented_rectangle:
  create_circle:
  create_line:
  create_point:
  create_linestrip:
  create_bezier2:
  create_bezier3:
  create_catmull_rom:
  create_bspline:
  edit_shape: Ctrl+J
  delete_shape: Delete
  duplicate_shape: Ctrl+D
  copy_shape: Ctrl+C
  paste_shape: Ctrl+V
  undo: Ctrl+Z
  undo_last_point: Ctrl+Z
  edit_label: Ctrl+E
  add_point_to_edge: V
  split_linestrip: B
  copy_annotations_to_next: Shift+N
  merge_linestrips: M
  toggle_keep_prev_mode: Ctrl+P
  toggle_snap_to_point: S
  remove_selected_point: [X, Backspace]
  show_all_shapes:
  hide_all_shapes:
  toggle_all_shapes: T
